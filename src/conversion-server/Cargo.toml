[package]
name = "conversion-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "conversion-server"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
tonic = "0.12.3"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
async-stream = "0.3.6"
futures-core = "0.3.31"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
]

[dev-dependencies]
tokio-stream = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }
